<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Header -->
  <rect x="0" y="0" width="320" height="40" rx="8" fill="#4285f4"/>
  <rect x="0" y="20" width="320" height="20" fill="#4285f4"/>
  <circle cx="18" cy="20" r="8" fill="#fff"/>
  <text x="34" y="24" font-size="11" fill="#fff" font-family="Arial" font-weight="bold">Google Gemini</text>
  <!-- Messages -->
  <rect x="10" y="50" width="190" height="28" rx="14" fill="#383850"/>
  <text x="20" y="68" font-size="9" fill="#e0e0f0" font-family="Arial">你好！我是Gemini，Google的AI</text>
  <rect x="130" y="86" width="180" height="28" rx="14" fill="#4285f4"/>
  <text x="140" y="104" font-size="9" fill="#fff" font-family="Arial">帮我写一首关于春天的诗</text>
  <rect x="10" y="122" width="240" height="38" rx="14" fill="#383850"/>
  <text x="20" y="138" font-size="9" fill="#e0e0f0" font-family="Arial">春风拂面柳如烟，花开满地香满园。</text>
  <text x="20" y="152" font-size="9" fill="#e0e0f0" font-family="Arial">燕子归巢啼声脆，春意盎然满人间。</text>
  <rect x="140" y="168" width="170" height="24" rx="14" fill="#4285f4"/>
  <text x="150" y="184" font-size="9" fill="#fff" font-family="Arial">太美了！谢谢</text>
</svg>